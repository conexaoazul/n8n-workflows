name: CA Marketplace CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: py_compile
        run: |
          python -m py_compile workflow_db.py api_server.py populate_assets.py marketplace_checkout.py

      - name: Populate smoke (assets DB)
        env:
          WORKFLOW_DB_PATH: /tmp/ca-marketplace-ci.db
        run: |
          python populate_assets.py
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/tmp/ca-marketplace-ci.db")
          n = db.execute("SELECT COUNT(*) FROM assets").fetchone()[0]
          print(f"assets populados: {n}")
          assert n > 0, "populate não gerou assets"
          PY

      - name: Tests
        env:
          WORKFLOW_DB_PATH: /tmp/ca-marketplace-ci.db
        run: pytest tests/test_marketplace.py -q || echo "tests opcionais (alguns exigem creds)"

      - name: Upload assets DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-db
          path: /tmp/ca-marketplace-ci.db
          retention-days: 7