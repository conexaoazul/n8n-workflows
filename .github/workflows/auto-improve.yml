name: CA Marketplace Auto-Improve

# Auto-melhoria incremental autônoma: cron diário + manual.
# 1. Sync submodules vendors/ (forks conexaoazul/*) → último commit
# 2. Re-popula tabela assets (workflows + skills novos)
# 3. Commit + push incremental se houver mudança
# 4. Relatório Telegram opcional

on:
  schedule:
    - cron: "17 3 * * *"  # diário 03:17 UTC
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Forçar commit mesmo sem mudanças"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: auto-improve
  cancel-in-progress: false

jobs:
  sync-and-improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate compile
        run: python -m py_compile workflow_db.py api_server.py populate_assets.py marketplace_checkout.py sync_workflows_to_n8n.py

      - name: Sync vendors + re-populate assets + commit incremental
        env:
          WORKFLOW_DB_PATH: workflows.db
          FORCE_COMMIT: ${{ github.event.inputs.force_commit }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # sync submodules (update --remote) + re-populate assets
          git submodule update --remote --merge
          cp database/workflows.db workflows.db 2>/dev/null || true
          python populate_assets.py
          N=$(python - <<'PY'
          import sqlite3
          print(sqlite3.connect("workflows.db").execute("SELECT COUNT(*) FROM assets").fetchone()[0])
          PY
          )
          echo "Assets: $N"
          git add .gitmodules vendors/ workflows.db 2>/dev/null || true
          if ! git diff --staged --quiet || [[ "$FORCE_COMMIT" == "true" ]]; then
            git commit -m "chore(auto-improve): sync vendors + ${N} assets

            Sync incremental automático: submodules vendors/ (forks
            conexaoazul/*) + re-população da tabela assets.

            Co-Authored-By: Diego Santos <diego@conexaoazul.com>"
            git push
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "Sem mudanças."
            echo "changed=false" >> $GITHUB_ENV
          fi
          echo "assets_count=$N" >> $GITHUB_ENV

      - name: Tests
        env:
          WORKFLOW_DB_PATH: workflows.db
        run: pytest tests/test_marketplace.py -q || echo "tests opcionais"

      - name: Relatório Telegram (opcional)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🛒 CA Marketplace auto-improve: ${{ env.assets_count }} assets. Mudança: ${{ env.changed }}."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MSG}" || true